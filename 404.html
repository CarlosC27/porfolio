<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        var path = l.pathname + l.search + l.hash;
        if (path && path !== "/") {
          // redirect to index.html with ?p= param
          l.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?p=" + encodeURIComponent(path));
        }
      })(window.location);
    </script>
  </head>
  <body>
    <h2>Redirecting…</h2>
  </body>
</html>
